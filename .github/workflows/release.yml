name: Release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock
      - .release-version
  push:
    branches: [main]
    paths: [.release-version]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: reef-macos-arm64
            binary: reef
          - os: macos-15-intel
            asset: reef-macos-x86_64
            binary: reef
          - os: ubuntu-24.04
            asset: reef-linux-x86_64
            binary: reef
          - os: windows-2022
            asset: reef-windows-x86_64
            binary: reef.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          REEF_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "$REEF_TAG" = "v$version"

      - name: Verify merged release marker
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "$(<.release-version)" = "$version"

      - name: Build and test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            python3 -m unittest discover -s scripts -p 'test_*.py'
          fi
          cargo test --locked
          cargo build --release --locked
          target/release/${{ matrix.binary }} --version

      - name: Package binary
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir dist
          tar -czf "dist/${ASSET}.tar.gz" -C target/release "$BINARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            reef_tag="$GITHUB_REF_NAME"
          else
            reef_tag="v$(<.release-version)"
            if tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$reef_tag" \
              --jq 'select(.object.type == "commit") | .object.sha' 2> tag-error.txt); then
              test "$tag_sha" = "$GITHUB_SHA"
            elif grep -q '(HTTP 404)' tag-error.txt; then
              gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST \
                -f ref="refs/tags/$reef_tag" -f sha="$GITHUB_SHA" >/dev/null
            else
              cat tag-error.txt >&2
              exit 1
            fi
          fi
          cd dist
          sha256sum reef-*.tar.gz > SHA256SUMS
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$reef_tag" >/dev/null 2> release-error.txt; then
            :
          elif grep -q '(HTTP 404)' release-error.txt; then
            gh release create "$reef_tag" --repo "$GITHUB_REPOSITORY" \
              --title "Reef $reef_tag" --generate-notes --verify-tag --draft
          else
            cat release-error.txt >&2
            exit 1
          fi
          for asset in reef-*.tar.gz SHA256SUMS; do
            if ! gh release view "$reef_tag" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              gh release upload "$reef_tag" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
          done
          gh release edit "$reef_tag" --repo "$GITHUB_REPOSITORY" --draft=false
