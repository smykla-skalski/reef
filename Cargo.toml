[package]
name = "reef"
version = "0.1.0"
description = "Resource-aware scheduling for coding agents"
authors = ["Marcin Skalski"]
edition = "2024"
license = "MIT"
repository = "https://github.com/smykla-skalski/reef"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(unix)'.dependencies]
blake3 = "1"
fs2 = "0.4.3"
nix = { version = "0.31.3", features = ["fs", "process", "signal", "term", "user"] }
signal-hook = "=0.4.4"
wait4 = "0.2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
